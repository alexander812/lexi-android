[versions]
agp = "8.2.2"
kotlin = "1.9.21"
coreKtx = "1.12.0"
activity = "1.8.2"
webkit = "1.8.0"
exifinterface = "1.3.6"
tesseract4android = "4.9.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android-openmp", version.ref = "tesseract4android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
